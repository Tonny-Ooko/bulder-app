name: my_new_project
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  cloud_firestore: ^5.4.1 # Replace with the latest version
  firebase_auth: ^5.2.1
  google_sign_in: ^6.0.0
  google_sign_in_web: 0.12.4+2
  image_picker: ^0.8.7+4
  firebase_core:  ^3.4.1  # Make sure it's compatible with other Firebase packages
  firebase_storage: ^12.3.0
  contacts_service: ^0.6.3
  permission_handler: ^10.2.0
  http: ^0.13.5  # Or the latest version
  shared_preferences: ^2.1.2
  webview_flutter: ^3.0.0
  speech_to_text: ^5.1.0
  flutter_typeahead: ^4.0.0
 

dev_dependencies:
